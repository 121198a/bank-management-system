name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  backend-e2e:
    # Real MongoDB replica set (transactions are required by deposit/withdraw/transfer).
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ping:1}).ok" && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "rs.status().myState" | grep -q '^1$' && break
            sleep 2
          done
      - run: npm ci
        working-directory: backend
      - name: End-to-end tests
        run: npm run test:e2e
        working-directory: backend
        env:
          E2E_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
          RATE_LIMIT_AUTH_MAX: "100"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      # react-router advisories need the v6->v7 migration (tracked in docs/DECISIONS.md);
      # gate on high+ only until then.
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  frontend-browser:
    # 146 browser checks: the kit's 20 viewports x public pages (no horizontal overflow) and axe WCAG scans.
    # NON-BLOCKING until it has run green once; then remove `continue-on-error` to make it a gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
